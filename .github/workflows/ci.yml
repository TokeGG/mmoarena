# Typecheck, build and test every pull request and every push to main. A pull request that fails here must not be merged.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Typecheck
        run: |
          npx tsc --noEmit -p shared
          npx tsc --noEmit -p server
          npx tsc --noEmit -p client
      - name: Build the client
        run: npm run build
      - name: Tests
        run: npx tsx --test shared/test/*.test.ts server/test/*.test.ts client/test/*.test.ts
