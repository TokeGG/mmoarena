# Render Blueprint. Optional: you can also create the Web Service by hand with the same settings.
services:
  - type: web
    name: wow-arena
    runtime: node
    region: virginia        # East coast, same fix as for Aim Arena
    plan: free
    # Vite is a devDependency, so install dev packages explicitly regardless of NODE_ENV.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Milliseconds per game tick: 16 = 62.5 updates a second (tighter fights, about 2x the CPU), 50 = 20 a second (the old rate).
      # Whole number from 8 to 50; unset means 50. If the Render dashboard already has its own environment variables for this
      # service, add ARENA_TICK_MS there by hand (a blueprint sync does not overwrite dashboard values). See README "Running at 62.5 Hz".
      - key: ARENA_TICK_MS
        value: "16"
      # The dev panel's Redeploy button: Render, this service, Settings, Deploy Hook (copy the URL). Paste it into the dashboard;
      # it is a secret, so it is not stored in this file.
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false
